<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Simple Interest Calculator</h1>
    <p class="subtitle">Calculate simple interest quickly and easily.</p>

    <form id="interestForm">
      <label for="principal">Principal Amount</label>
      <input type="number" id="principal" min="0" step="0.01" placeholder="Enter principal amount" required>

      <label for="rate">Annual Interest Rate (%)</label>
      <input type="number" id="rate" min="0" step="0.01" placeholder="Enter interest rate" required>

      <label for="time">Time (Years)</label>
      <input type="number" id="time" min="0" step="0.01" placeholder="Enter time in years" required>

      <button type="submit">Calculate Interest</button>
    </form>

    <section id="result" class="result" aria-live="polite">
      <div>
        <span>Simple Interest</span>
        <strong id="interest">₹0.00</strong>
      </div>
      <div>
        <span>Total Amount</span>
        <strong id="total">₹0.00</strong>
      </div>
    </section>

    <p class="formula">Formula: Simple Interest = (Principal × Rate × Time) ÷ 100</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
